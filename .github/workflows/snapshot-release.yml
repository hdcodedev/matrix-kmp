# Coordinates Maven snapshot publication from one immutable commit.
# It runs when recent code changes justify a snapshot publish.
name: Snapshot Release

on:
  workflow_call:
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      SIGNING_KEY_ID:
        required: true
      SIGNING_PASSWORD:
        required: true
      SIGNING_IN_MEMORY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for the manual snapshot run.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect recent changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual snapshot run requested."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git log --since="24 hours ago" --name-only --pretty=format: | sort -u)
          if [ -z "${files:-}" ]; then
            echo "No commits in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          filtered="$({
            while IFS= read -r file; do
              case "${file}" in
                release-notes/*) printf '%s\n' "${file}" ;;
                docs/*|*.md|LICENSE|LICENSE.*) ;;
                *) printf '%s\n' "${file}" ;;
              esac
            done <<< "${files}"
          } | sort -u)"
          if [ -z "${filtered:-}" ]; then
            echo "Only ignored paths changed in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in the last 24 hours:"
            echo "$filtered"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-snapshot:
    name: Prepare Snapshot Release
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    environment: Snapshot
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record immutable snapshot source
        id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-maven:
    name: Publish Snapshot to Maven Central
    needs: [prepare-snapshot]
    runs-on: ubuntu-latest
    environment: Snapshot
    steps:
      - name: Checkout snapshot source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-snapshot.outputs.source_sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Prepare publishing
        uses: ./.github/actions/prepare-matrix-publishing
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          signing-in-memory-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}

      - name: Publish snapshot
        run: ./gradlew :matrix:publish -PmatrixReleaseVersion=1.0.0-SNAPSHOT --no-daemon

  announce-snapshot:
    name: Announce Snapshot Release
    needs: [prepare-snapshot, publish-maven]
    runs-on: ubuntu-latest
    steps:
      - name: Comment on commit
        uses: actions/github-script@v9
        with:
          script: |
            const message = [
              '🚀 **Snapshot Release Published**',
              '',
              'Version: `1.0.0-SNAPSHOT`',
              '',
              'The snapshot is now available on Maven Central Snapshots repository.',
              '',
              'https://central.sonatype.com/repository/maven-snapshots/io/github/hdcodedev/matrix/maven-metadata.xml',
              '',
              'Dependency:',
              '```kotlin',
              'implementation("io.github.hdcodedev:matrix:1.0.0-SNAPSHOT")',
              '```',
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            })
